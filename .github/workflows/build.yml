name: Construir sitio

on:
  push:
    branches: [main]
    paths:
      - 'fuente/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 fuente/construir.py
      - run: |
          if git diff --quiet -- index.html; then
            echo "sin cambios"
          else
            git config user.name "Artemisa Bot"
            git config user.email "actions@users.noreply.github.com"
            git add index.html
            git commit -m "Regenerar index.html [automatico]"
            git push
          fi
