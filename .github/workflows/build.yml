name: Construir sitio

on:
  push:
    branches: [main]
    paths:
      - 'fuente/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 fuente/construir.py
      - run: |
          git add index.html
          if [ -d galeria ]; then git add galeria; fi
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git config user.name "Artemisa Bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Regenerar index.html y galeria/ [automatico]"
            git push
          fi
